# ergon install manifest — Layer 0 of the setup contract (scuderia spec §8).
# Mirrors profiles/mnemo/manifest.yaml; see that file for the contract prose.

manifest_version: 1
profile: ergon

# Directories the instance must have. Derived from schema.yaml kinds plus the
# instance-skill layer; listed explicitly so init is declarative.
dirs:
  - runs
  - proposals
  - skills
  - user
  - working-docs

# Files copied into the instance at scaffold time. `template` is relative to
# the profile root; `target` is relative to the instance root. Placeholders
# {{INSTANCE_NAME}} and {{CREATED}} are substituted in file contents.
files:
  - template: example-instance/instance.yaml
    target: instance.yaml
  - template: SOUL.md
    target: SOUL.md
    strip_header: true
  - template: STYLE/STYLE.md
    target: STYLE/STYLE.md
    strip_header: true
  - template: STYLE/plotting/plotting.md
    target: STYLE/plotting/plotting.md
  - template: STYLE/plotting/heatmaps.md
    target: STYLE/plotting/heatmaps.md
  - template: STYLE/structures/structures.md
    target: STYLE/structures/structures.md
  - template: STYLE/structures/fv-antigen.md
    target: STYLE/structures/fv-antigen.md
  - template: STYLE/assets/README.md
    target: STYLE/assets/README.md
  - template: STYLE/assets/palettes.yaml
    target: STYLE/assets/palettes.yaml
  - template: STYLE/assets/chimera/charcoal_ghost.cxc
    target: STYLE/assets/chimera/charcoal_ghost.cxc
  - template: STYLE/assets/chimera/warm_paper_ghost.cxc
    target: STYLE/assets/chimera/warm_paper_ghost.cxc

placeholders:
  INSTANCE_NAME: the instance's name (agents are named)
  CREATED: ISO date of scaffold

# Harness-side bindings are NOT performed by the CLI; they are documented
# one-liners in docs/harnesses/<harness>.md and verified by `scuderia doctor`.
bindings:
  - id: harness-character
    description: harness loads the instance SOUL.md (and the user model, USER/<name>.md) at session start
    verify: harness-specific; see the adapter doc
  - id: harness-skills
    description: harness skill path exposes the layered skill set
                 (core < profile template < instance)
    verify: harness-specific; see the adapter doc
  - id: harness-cwd
    description: sessions run with the instance root as working directory
    verify: harness-specific; see the adapter doc
  - id: harness-agora
    description: "AGORA_ROOT is set in the harness per-profile environment (Hermes: profile .env) so the core agora-exchange skill resolves"
    verify: harness-specific; see the adapter doc
