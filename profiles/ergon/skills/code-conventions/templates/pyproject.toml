[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "<package-name>"
dynamic = ["version"]
description = "<one-line description>"
readme = "README.md"
license = { text = "<MIT|BSD-3-Clause|...>" }
requires-python = ">=3.10"
authors = [{ name = "<author name>", email = "<author email>" }]
keywords = ["<keyword>"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/<org>/<repo>"
Documentation = "https://<package-name>.readthedocs.io"
Repository = "https://github.com/<org>/<repo>"
Issues = "https://github.com/<org>/<repo>/issues"

# Dev deps are a uv dependency-group (CI/dev use uv throughout).
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

# Docs deps are an extra, not a group: Read the Docs and other pip consumers
# cannot read dependency-groups. Local docs preview: uv sync --extra docs
[project.optional-dependencies]
docs = [
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.25",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/<package_name>"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests exercising real-world use (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src/<package_name>"]
