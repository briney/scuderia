site_name: <package-name>
site_description: <one-line description>
repo_url: https://github.com/<org>/<repo>

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            members_order: source

nav:
  - Home: index.md
  - Usage: usage/
  - API Reference: reference/

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
