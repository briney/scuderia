[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-source-package"
version = "0.2.0"
description = "Retirement shims for obsolete PDF workflow entry points"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24", "Pillow>=10", "PyYAML>=6"]

[project.scripts]
pdf-source-package = "pdf_source_package.cli:main"
pdf-workflow = "pdf_source_package.launcher:main"

[tool.setuptools.packages.find]
include = ["pdf_source_package*", "pdf_enrichment*", "qualified_enrichment*"]
