[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-source-package"
version = "0.1.0"
description = "Staged native PDF selection, original-source crops and reference-only document association"
requires-python = ">=3.11"
dependencies = ["PyMuPDF==1.28.2", "Pillow==12.3.0", "transformers==5.17.0", "torch==2.14.0", "numpy==2.4.6", "tokenizers==0.23.2"]

[project.scripts]
pdf-source-package = "pdf_source_package.cli:main"
pdf-workflow = "pdf_source_package.launcher:main"

[tool.setuptools.packages.find]
include = ["pdf_source_package*", "pdf_enrichment*", "qualified_enrichment*"]

[tool.setuptools.package-data]
pdf_source_package = ["assets/*.txt", "assets/*.json"]
