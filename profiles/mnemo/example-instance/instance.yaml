# instance.yaml — the instance contract (scuderia spec §5)
# This file binds an instance repo to a profile. It is the entire
# platform→instance API: the platform validates this file plus the
# directories the profile's schema.yaml declares.
#
# `scuderia init` fills the placeholders; `scuderia doctor` validates the result.

name: {{INSTANCE_NAME}}        # agents are named; templates are generic
profile: mnemo                 # which scuderia profile template this instance runs
profile_version: 1             # pin against the profile's schema_version lineage
schema_version: 1              # the profile schema.yaml version this instance conforms to
created: {{CREATED}}           # ISO date, filled at scaffold time
